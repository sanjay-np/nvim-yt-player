name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Headless Verification Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim_version: [stable, nightly]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Run Module Verification Tests
        run: |
          nvim --headless -u NONE -c 'set rtp+=.' -c 'lua
          local modules = {
            "yt-player",
            "yt-player.commands",
            "yt-player.history",
            "yt-player.init",
            "yt-player.keymaps",
            "yt-player.mpv",
            "yt-player.notify",
            "yt-player.player",
            "yt-player.playlists",
            "yt-player.queue",
            "yt-player.radio",
            "yt-player.search",
            "yt-player.session",
            "yt-player.state",
            "yt-player.status",
            "yt-player.utils",
          }

          for _, mod in ipairs(modules) do
            assert(pcall(require, mod), "Failed to load module: " .. mod)
          end

          require("yt-player").setup({})
          require("yt-player.commands").setup()

          -- Test atomic json
          local utils = require("yt-player.utils")
          local tmp = vim.fn.stdpath("cache") .. "/ci_test.json"
          assert(utils.atomic_write_json(tmp, { ok = true }), "atomic_write_json failed")
          local data, corrupt = utils.read_json_file(tmp, {})
          assert(not corrupt and data.ok == true, "read_json_file failed")
          pcall(os.remove, tmp)

          -- Test format_time
          assert(utils.format_time(-5) == "0:00", "format_time negative clamp failed")
          assert(utils.format_time(125) == "2:05", "format_time positive failed")

          -- Test notify escaping
          local notify = require("yt-player.notify")
          notify.setup({ enabled = true, notify_on_track_change = true })
          notify.track_change("100%1 Hits", "Artist 50% Off")

          -- Test statusline
          local status = require("yt-player.status")
          status.setup({ enabled = true })
          local state = require("yt-player.state")
          state.update({ connected = true, playing = true, title = "Test 100%", duration = 120 })
          local line = status.get_statusline()
          assert(line and line ~= "", "statusline empty")

          print("All CI verification assertions passed successfully!")
          ' -c 'q'
